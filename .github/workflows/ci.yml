name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff mypy pytest pytest-asyncio httpx fastapi pydantic pydantic-settings
      - run: ruff check backend/app/modules backend/app/core backend/app/api/v1/endpoints/agent.py || true
      - run: mypy backend/app/modules/agent/state.py backend/app/modules/agent/runtime.py || true
      - run: pytest backend/tests/test_agent_engineering.py -q
